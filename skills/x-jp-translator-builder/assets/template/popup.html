<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X JP Translator</title>
  <style>
    body { width: 420px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
    input, textarea, button { width: 100%; box-sizing: border-box; }
    input, textarea { padding: 8px; margin-top: 6px; margin-bottom: 10px; }
    button { padding: 10px; border: 0; border-radius: 8px; background: #111827; color: white; cursor: pointer; }
    .muted { color: #6b7280; font-size: 12px; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; margin-top: 10px; }
    img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    pre { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <h3>X 投稿 日本語翻訳</h3>
  <label class="muted">OpenAI APIキー（保存されます）</label>
  <input id="apiKey" type="password" placeholder="sk-..." />

  <label class="muted">X投稿URL（単一）</label>
  <input id="tweetUrl" type="text" placeholder="https://x.com/.../status/..." />

  <button id="runBtn">取得して翻訳</button>
  <p id="status" class="muted"></p>

  <div id="result" class="card" style="display:none;">
    <p class="muted">原文</p>
    <pre id="originalText"></pre>
    <p class="muted" style="margin-top:8px;">日本語訳</p>
    <pre id="jaText"></pre>
    <div id="images"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
